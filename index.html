<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SmartStyle - הארון הדיגיטלי והסטייליסט האישי</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;600;700;800&display=swap');
        body {
            font-family: 'Heebo', sans-serif;
            background-color: #0b0f19;
            color: #f1f5f9;
        }
        .cyber-bg {
            background: radial-gradient(circle at 50% 0%, rgba(99, 102, 241, 0.15) 0%, rgba(11, 15, 25, 1) 70%);
        }
        .glass-card {
            background: rgba(17, 24, 39, 0.7);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
        }
        .mannequin-container {
            background: radial-gradient(circle at center, rgba(30, 41, 59, 0.8) 0%, rgba(15, 23, 42, 0.95) 100%);
            border: 1px solid rgba(99, 102, 241, 0.2);
        }
        
        /* Gazarot / Apparel Cutout Styles */
        .top-cutout {
            clip-path: polygon(25% 0%, 75% 0%, 100% 25%, 80% 40%, 75% 25%, 75% 100%, 25% 100%, 25% 25%, 20% 40%, 0% 25%);
        }
        .bottom-cutout {
            clip-path: polygon(15% 0%, 85% 0%, 90% 100%, 55% 100%, 50% 30%, 45% 100%, 10% 100%);
        }
        .shoes-cutout {
            clip-path: inset(0 0 0 0 round 16px);
        }

        .item-slot {
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .item-slot:hover {
            transform: scale(1.03);
            border-color: #818cf8;
        }
    </style>
</head>
<body class="min-h-screen pb-12 cyber-bg">

    <!-- Header -->
    <header class="border-b border-slate-800 bg-slate-900/60 sticky top-0 z-50 backdrop-blur-xl">
        <div class="max-w-6xl mx-auto px-4 py-4 flex justify-between items-center">
            <div class="flex items-center gap-3">
                <div class="p-2.5 bg-indigo-600/20 border border-indigo-500/40 rounded-2xl text-indigo-400 shadow-lg shadow-indigo-500/20">
                    <i class="fa-solid fa-shirt text-xl"></i>
                </div>
                <div>
                    <h1 class="text-2xl font-extrabold bg-gradient-to-r from-indigo-400 via-cyan-400 to-teal-300 bg-clip-text text-transparent">SmartStyle AI</h1>
                    <p class="text-xs text-slate-400 font-medium">ארון דיגיטלי להתאמת צבעים ולוקים חכמים</p>
                </div>
            </div>
            <div class="text-xs font-semibold bg-indigo-950/60 text-indigo-300 px-3.5 py-2 rounded-full border border-indigo-800/50 shadow-inner">
                <i class="fa-solid fa-layer-group text-cyan-400 ml-1"></i> <span id="item-count">0</span> פריטים בארון
            </div>
        </div>
    </header>

    <main class="max-w-6xl mx-auto px-4 mt-6 grid grid-cols-1 lg:grid-cols-12 gap-6">

        <!-- Left / Top Controls & Mannequin Display -->
        <section class="lg:col-span-7 flex flex-col gap-6">
            
            <!-- Outfit Generator Controls -->
            <div class="glass-card rounded-3xl p-6 shadow-2xl">
                <h2 class="text-lg font-bold mb-4 flex items-center gap-2 text-indigo-300">
                    <i class="fa-solid fa-wand-magic-sparkles text-cyan-400"></i> הרכבת לוק חכם ומותאם צבעים
                </h2>

                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 mb-5">
                    <!-- Event Picker -->
                    <div>
                        <label class="block text-xs font-bold text-slate-400 mb-1.5">לאן הולכים?</label>
                        <select id="event-select" class="w-full bg-slate-800/80 border border-slate-700/80 text-slate-200 rounded-2xl p-3 text-sm focus:outline-none focus:border-indigo-500 transition">
                            <option value="all">הכל מתאים (אקראי חכם)</option>
                            <option value="work">💼 עבודה / פגישה</option>
                            <option value="event">🎉 אירוע / ערב</option>
                            <option value="gym">🏋️‍♂️ ספורט / אימון</option>
                            <option value="errands">🛒 סידורים / פנאי</option>
                            <option value="casual">☕ יום-יומי</option>
                        </select>
                    </div>

                    <!-- Weather Picker -->
                    <div>
                        <label class="block text-xs font-bold text-slate-400 mb-1.5">מזג אוויר</label>
                        <select id="weather-select" class="w-full bg-slate-800/80 border border-slate-700/80 text-slate-200 rounded-2xl p-3 text-sm focus:outline-none focus:border-indigo-500 transition">
                            <option value="all">כל עונה</option>
                            <option value="summer">☀️ קיץ / חם</option>
                            <option value="winter">🌧️ חורף / קר</option>
                            <option value="transition">🍂 עונת מעבר</option>
                        </select>
                    </div>
                </div>

                <button onclick="generateOutfit()" class="w-full py-4 bg-gradient-to-r from-indigo-600 via-indigo-500 to-cyan-500 hover:opacity-95 text-white font-extrabold rounded-2xl shadow-lg shadow-indigo-500/25 flex items-center justify-center gap-2 transition transform active:scale-95 text-base">
                    <i class="fa-solid fa-palette text-lg"></i> התאם לי לוק עתידני!
                </button>
            </div>

            <!-- Mannequin / Outfit Visualization -->
            <div class="glass-card rounded-3xl p-6 shadow-2xl mannequin-container relative flex flex-col items-center justify-center min-h-[560px] overflow-hidden">
                <span class="absolute top-4 right-4 text-xs font-bold text-cyan-300 bg-cyan-950/60 px-3.5 py-1.5 rounded-full border border-cyan-800/50 z-10">
                    <i class="fa-solid fa-user-astronaut text-indigo-400 ml-1"></i> בובת ראווה
                </span>

                <!-- Mannequin Head & Neck Background Silhouette -->
                <div class="absolute top-12 flex flex-col items-center opacity-20 pointer-events-none">
                    <div class="w-16 h-20 bg-slate-500 rounded-full mb-1"></div>
                    <div class="w-8 h-8 bg-slate-500 rounded-t-lg"></div>
                </div>

                <!-- Mannequin Outline & Clothes Stack -->
                <div class="relative w-64 h-[480px] flex flex-col items-center justify-between py-2 z-0 mt-8">
                    
                    <!-- Top Slot (Shirts Cutout) -->
                    <div id="slot-top" class="item-slot w-52 h-40 border-2 border-dashed border-slate-700/80 rounded-2xl flex flex-col items-center justify-center text-slate-500 bg-slate-900/40 overflow-hidden relative">
                        <i class="fa-solid fa-shirt text-3xl mb-1 text-indigo-400/60"></i>
                        <span class="text-xs font-semibold">חולצה / טופ</span>
                    </div>

                    <!-- Bottom Slot (Pants Cutout) -->
                    <div id="slot-bottom" class="item-slot w-44 h-48 border-2 border-dashed border-slate-700/80 rounded-2xl flex flex-col items-center justify-center text-slate-500 bg-slate-900/40 overflow-hidden relative -mt-3">
                        <i class="fa-solid fa-socks text-3xl mb-1 text-cyan-400/60"></i>
                        <span class="text-xs font-semibold">מכנסיים</span>
                    </div>

                    <!-- Shoes Slot -->
                    <div id="slot-shoes" class="item-slot w-40 h-20 border-2 border-dashed border-slate-700/80 rounded-2xl flex flex-col items-center justify-center text-slate-500 bg-slate-900/40 overflow-hidden relative">
                        <i class="fa-solid fa-shoe-prints text-2xl mb-1 text-teal-400/60"></i>
                        <span class="text-xs font-semibold">נעליים</span>
                    </div>

                </div>

                <!-- Action Buttons for Current Outfit -->
                <div id="outfit-actions" class="hidden flex gap-3 mt-4 z-10 w-full max-w-xs">
                    <button onclick="saveCurrentOutfit()" class="flex-1 py-2.5 bg-rose-600/80 hover:bg-rose-600 border border-rose-500/40 text-white font-bold text-xs rounded-xl shadow-lg transition flex items-center justify-center gap-1.5">
                        <i class="fa-solid fa-heart"></i> שמור לוק
                    </button>
                    <button onclick="shareCurrentOutfit()" class="flex-1 py-2.5 bg-cyan-600/80 hover:bg-cyan-600 border border-cyan-500/40 text-white font-bold text-xs rounded-xl shadow-lg transition flex items-center justify-center gap-1.5">
                        <i class="fa-solid fa-share-nodes"></i> שתף לוק
                    </button>
                </div>
            </div>

            <!-- Saved Outfits Gallery -->
            <div class="glass-card rounded-3xl p-6 shadow-2xl">
                <h2 class="text-lg font-bold mb-4 flex items-center gap-2 text-indigo-300">
                    <i class="fa-solid fa-heart text-rose-400"></i> לוקים שמורים
                </h2>
                <div id="saved-outfits-grid" class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <!-- Saved outfits rendered dynamically -->
                </div>
            </div>

        </section>

        <!-- Right / Bottom Closet & Item Upload -->
        <section class="lg:col-span-5 flex flex-col gap-6">

            <!-- Add Item Form -->
            <div class="glass-card rounded-3xl p-6 shadow-2xl">
                <h2 class="text-lg font-bold mb-4 flex items-center gap-2 text-indigo-300">
                    <i class="fa-solid fa-plus-circle text-cyan-400"></i> הוספת בגד חדש לארון
                </h2>

                <form id="add-item-form" onsubmit="handleAddItem(event)" class="flex flex-col gap-3.5">
                    <div>
                        <label class="block text-xs font-bold text-slate-400 mb-1">שם הפריט</label>
                        <input type="text" id="item-name" required placeholder="לדוגמה: חולצה מכופתרת כחולה" class="w-full bg-slate-800/80 border border-slate-700/80 text-slate-200 rounded-2xl p-2.5 text-sm focus:outline-none focus:border-indigo-500 transition">
                    </div>

                    <div class="grid grid-cols-2 gap-3">
                        <div>
                            <label class="block text-xs font-bold text-slate-400 mb-1">סוג פריט</label>
                            <select id="item-type" required class="w-full bg-slate-800/80 border border-slate-700/80 text-slate-200 rounded-2xl p-2.5 text-sm focus:outline-none focus:border-indigo-500 transition">
                                <option value="top">חולצה / ג'קט</option>
                                <option value="bottom">מכנסיים</option>
                                <option value="shoes">נעליים</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-xs font-bold text-slate-400 mb-1">מזג אוויר</label>
                            <select id="item-weather" required class="w-full bg-slate-800/80 border border-slate-700/80 text-slate-200 rounded-2xl p-2.5 text-sm focus:outline-none focus:border-indigo-500 transition">
                                <option value="all">כל השנה</option>
                                <option value="summer">קיץ</option>
                                <option value="winter">חורף</option>
                                <option value="transition">מעבר</option>
                            </select>
                        </div>
                    </div>

                    <div class="grid grid-cols-2 gap-3">
                        <div>
                            <label class="block text-xs font-bold text-slate-400 mb-1">אירוע מתאים</label>
                            <select id="item-event" required class="w-full bg-slate-800/80 border border-slate-700/80 text-slate-200 rounded-2xl p-2.5 text-sm focus:outline-none focus:border-indigo-500 transition">
                                <option value="casual">יום-יומי</option>
                                <option value="work">עבודה / פגישה</option>
                                <option value="event">אירוע / ערב</option>
                                <option value="gym">ספורט / אימון</option>
                                <option value="errands">סידורים / פנאי</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-xs font-bold text-slate-400 mb-1">צבע</label>
                            <select id="item-color" class="w-full bg-slate-800/80 border border-slate-700/80 text-slate-200 rounded-2xl p-2.5 text-sm focus:outline-none focus:border-indigo-500 transition">
                                <option value="auto">✨ זיהוי אוטומטי</option>
                                <option value="black">שחור</option>
                                <option value="white">לבן</option>
                                <option value="grey">אפור</option>
                                <option value="blue">כחול / ג'ינס</option>
                                <option value="beige">בז' / חום</option>
                                <option value="green">ירוק</option>
                                <option value="red">אדום</option>
                            </select>
                        </div>
                    </div>

                    <div>
                        <label class="block text-xs font-bold text-slate-400 mb-1">תמונת הפריט</label>
                        <input type="file" id="item-image" accept="image/*" required class="w-full text-xs text-slate-400 file:mr-4 file:py-2 file:px-4 file:rounded-xl file:border-0 file:text-xs file:font-bold file:bg-indigo-600 file:text-white hover:file:bg-indigo-500 cursor-pointer">
                    </div>

                    <button type="submit" id="submit-btn" class="mt-2 py-3 bg-indigo-600/30 hover:bg-indigo-600/50 border border-indigo-500/50 text-indigo-200 font-bold rounded-2xl shadow-lg transition flex items-center justify-center gap-2">
                        <i class="fa-solid fa-cloud-arrow-up text-cyan-400"></i> שמור בארון
                    </button>
                </form>
            </div>

            <!-- Closet Inventory -->
            <div class="glass-card rounded-3xl p-6 shadow-2xl flex-1 flex flex-col">
                <div class="flex justify-between items-center mb-4">
                    <h2 class="text-lg font-bold flex items-center gap-2 text-indigo-300">
                        <i class="fa-solid fa-boxes-packing text-cyan-400"></i> הארון שלי
                    </h2>
                    <button onclick="clearCloset()" class="text-[10px] text-rose-400 hover:underline">נקה ארון</button>
                </div>

                <div id="closet-grid" class="grid grid-cols-3 sm:grid-cols-4 gap-3 overflow-y-auto max-h-[320px] p-1">
                    <!-- Items rendered here dynamically -->
                </div>
            </div>

        </section>

    </main>

    <script>
        let closet = JSON.parse(localStorage.getItem('smartstyle_closet')) || [];
        let savedOutfits = JSON.parse(localStorage.getItem('smartstyle_saved_outfits')) || [];
        let currentOutfit = { top: null, bottom: null, shoes: null };

        const colorMap = {
            black: "שחור", white: "לבן", grey: "אפור",
            blue: "כחול", beige: "בז'", green: "ירוק", red: "אדום"
        };

        const matchingRules = {
            black: ['black', 'white', 'grey', 'blue', 'beige', 'green', 'red'],
            white: ['black', 'white', 'grey', 'blue', 'beige', 'green', 'red'],
            grey: ['black', 'white', 'grey', 'blue', 'beige'],
            blue: ['black', 'white', 'grey', 'blue', 'beige'],
            beige: ['black', 'white', 'blue', 'beige', 'green'],
            green: ['black', 'white', 'beige'],
            red: ['black', 'white', 'blue']
        };

        function saveCloset() {
            try {
                localStorage.setItem('smartstyle_closet', JSON.stringify(closet));
            } catch (e) {
                alert("אזהרה: זיכרון הדפדפן מלא! כדאי למחוק פריטים ישנים.");
            }
            renderCloset();
        }

        function saveSavedOutfits() {
            localStorage.setItem('smartstyle_saved_outfits', JSON.stringify(savedOutfits));
            renderSavedOutfits();
        }

        // Compress image to fit localStorage limits easily
        function compressImage(file, callback) {
            const reader = new FileReader();
            reader.onload = function(event) {
                const img = new Image();
                img.src = event.target.result;
                img.onload = function() {
                    const canvas = document.createElement('canvas');
                    const maxDim = 400;
                    let width = img.width;
                    let height = img.height;

                    if (width > height) {
                        if (width > maxDim) {
                            height *= maxDim / width;
                            width = maxDim;
                        }
                    } else {
                        if (height > maxDim) {
                            width *= maxDim / height;
                            height = maxDim;
                        }
                    }

                    canvas.width = width;
                    canvas.height = height;
                    const context = canvas.getContext('2d');
                    context.drawImage(img, 0, 0, width, height);

                    const compressedBase64 = canvas.toDataURL('image/jpeg', 0.7);
                    callback(compressedBase64);
                }
            };
            reader.readAsDataURL(file);
        }

        function extractColorFromImage(imgSrc, callback) {
            const img = new Image();
            img.crossOrigin = "Anonymous";
            img.src = imgSrc;
            img.onload = function () {
                const canvas = document.createElement("canvas");
                const ctx = canvas.getContext("2d");
                canvas.width = 50;
                canvas.height = 50;
                ctx.drawImage(img, 0, 0, 50, 50);
                const data = ctx.getImageData(0, 0, 50, 50).data;
                
                let r = 0, g = 0, b = 0, count = 0;
                for (let i = 0; i < data.length; i += 16) {
                    r += data[i];
                    g += data[i + 1];
                    b += data[i + 2];
                    count++;
                }
                r = Math.floor(r / count);
                g = Math.floor(g / count);
                b = Math.floor(b / count);

                callback(detectCategory(r, g, b));
            };
        }

        function detectCategory(r, g, b) {
            const brightness = (r + g + b) / 3;
            if (brightness < 60) return "black";
            if (brightness > 200) return "white";
            if (Math.abs(r - g) < 20 && Math.abs(g - b) < 20) return "grey";
            if (b > r && b > g) return "blue";
            if (g > r && g > b) return "green";
            if (r > g && r > b) return (g > 100) ? "beige" : "red";
            return "black";
        }

        function handleAddItem(e) {
            e.preventDefault();
            const btn = document.getElementById('submit-btn');
            btn.innerHTML = `<i class="fa-solid fa-spinner fa-spin"></i> שומר...`;

            const name = document.getElementById('item-name').value;
            const type = document.getElementById('item-type').value;
            const weather = document.getElementById('item-weather').value;
            const event = document.getElementById('item-event').value;
            const selectedColor = document.getElementById('item-color').value;
            const fileInput = document.getElementById('item-image');

            if (fileInput.files && fileInput.files[0]) {
                compressImage(fileInput.files[0], (compressedImage) => {
                    if (selectedColor === 'auto') {
                        extractColorFromImage(compressedImage, (detectedColor) => {
                            saveNewItem(name, type, weather, event, detectedColor, compressedImage);
                            btn.innerHTML = `<i class="fa-solid fa-cloud-arrow-up text-cyan-400"></i> שמור בארון`;
                        });
                    } else {
                        saveNewItem(name, type, weather, event, selectedColor, compressedImage);
                        btn.innerHTML = `<i class="fa-solid fa-cloud-arrow-up text-cyan-400"></i> שמור בארון`;
                    }
                });
            }
        }

        function saveNewItem(name, type, weather, event, color, image) {
            const newItem = {
                id: Date.now(),
                name, type, weather, event, color, image
            };
            closet.push(newItem);
            saveCloset();
            document.getElementById('add-item-form').reset();
        }

        function removeItem(id) {
            closet = closet.filter(item => item.id !== id);
            saveCloset();
        }

        function clearCloset() {
            if (confirm("האם אתה בטוח שברצונך למחוק את כל הפריטים בארון?")) {
                closet = [];
                saveCloset();
            }
        }

        function renderCloset() {
            const grid = document.getElementById('closet-grid');
            document.getElementById('item-count').textContent = closet.length;

            if (closet.length === 0) {
                grid.innerHTML = `<div class="col-span-full text-center py-8 text-slate-500 text-xs font-medium">הארון ריק כרגע.<br>הוסף בגדים כדי להתחיל!</div>`;
                return;
            }

            grid.innerHTML = closet.map(item => `
                <div class="relative group bg-slate-800/60 rounded-2xl overflow-hidden border border-slate-700/60 flex flex-col items-center p-2">
                    <img src="${item.image}" class="w-full h-20 object-cover rounded-xl mb-1">
                    <span class="text-[10px] text-slate-300 truncate w-full text-center font-bold">${item.name}</span>
                    <span class="text-[9px] text-cyan-400 font-semibold">${colorMap[item.color] || item.color}</span>
                    <button onclick="removeItem(${item.id})" class="absolute top-1.5 left-1.5 bg-rose-600/90 hover:bg-rose-600 text-white rounded-full w-5 h-5 flex items-center justify-center text-[10px] opacity-0 group-hover:opacity-100 transition shadow-sm">
                        ✕
                    </button>
                </div>
            `).join('');
        }

        function generateOutfit() {
            const selectedEvent = document.getElementById('event-select').value;
            const selectedWeather = document.getElementById('weather-select').value;

            const filterByType = (type) => {
                let items = closet.filter(i => i.type === type);
                if (selectedEvent !== 'all') {
                    items = items.filter(i => i.event === selectedEvent || i.event === 'casual');
                }
                if (selectedWeather !== 'all') {
                    items = items.filter(i => i.weather === selectedWeather || i.weather === 'all');
                }
                if (items.length === 0) items = closet.filter(i => i.type === type);
                return items;
            };

            const tops = filterByType('top');
            const bottoms = filterByType('bottom');
            const shoesList = filterByType('shoes');

            if (tops.length === 0 && bottoms.length === 0 && shoesList.length === 0) {
                alert("אנא הוסף פריטים לארון ראשית!");
                return;
            }

            const chosenTop = tops[Math.floor(Math.random() * tops.length)] || null;

            let compatibleBottoms = bottoms;
            if (chosenTop && chosenTop.color && matchingRules[chosenTop.color]) {
                const allowedColors = matchingRules[chosenTop.color];
                compatibleBottoms = bottoms.filter(b => allowedColors.includes(b.color));
                if (compatibleBottoms.length === 0) compatibleBottoms = bottoms;
            }
            const chosenBottom = compatibleBottoms[Math.floor(Math.random() * compatibleBottoms.length)] || null;

            let compatibleShoes = shoesList;
            if (chosenBottom && chosenBottom.color && matchingRules[chosenBottom.color]) {
                const allowedColors = matchingRules[chosenBottom.color];
                compatibleShoes = shoesList.filter(s => allowedColors.includes(s.color));
                if (compatibleShoes.length === 0) compatibleShoes = shoesList;
            }
            const chosenShoes = compatibleShoes[Math.floor(Math.random() * compatibleShoes.length)] || null;

            currentOutfit = { top: chosenTop, bottom: chosenBottom, shoes: chosenShoes };
            displayOutfit(currentOutfit);
        }

        function displayOutfit(outfit) {
            updateSlot('slot-top', outfit.top, 'חולצה', 'top-cutout');
            updateSlot('slot-bottom', outfit.bottom, 'מכנסיים', 'bottom-cutout');
            updateSlot('slot-shoes', outfit.shoes, 'נעליים', 'shoes-cutout');

            const actionsDiv = document.getElementById('outfit-actions');
            if (outfit.top || outfit.bottom || outfit.shoes) {
                actionsDiv.classList.remove('hidden');
            } else {
                actionsDiv.classList.add('hidden');
            }
        }

        function updateSlot(slotId, item, placeholder, cutoutClass) {
            const slot = document.getElementById(slotId);
            if (item) {
                slot.innerHTML = `
                    <div class="w-full h-full ${cutoutClass} overflow-hidden relative">
                        <img src="${item.image}" class="w-full h-full object-cover">
                    </div>
                    <div class="absolute bottom-0 inset-x-0 bg-slate-900/90 backdrop-blur-md text-slate-200 text-[10px] text-center py-0.5 truncate px-2 flex justify-between items-center font-bold border-t border-slate-800 z-10">
                        <span>${item.name}</span>
                        <span class="text-cyan-400 font-extrabold">${colorMap[item.color] || ''}</span>
                    </div>
                `;
            } else {
                slot.innerHTML = `<span class="text-xs text-slate-500">אין ${placeholder} מתאימה</span>`;
            }
        }

        function saveCurrentOutfit() {
            if (!currentOutfit.top && !currentOutfit.bottom && !currentOutfit.shoes) return;
            
            const newSavedOutfit = {
                id: Date.now(),
                top: currentOutfit.top,
                bottom: currentOutfit.bottom,
                shoes: currentOutfit.shoes,
                date: new Date().toLocaleDateString('he-IL')
            };

            savedOutfits.unshift(newSavedOutfit);
            saveSavedOutfits();
            alert("הלוק נשמר בהצלחה בלוקים השמורים! 💖");
        }

        function removeSavedOutfit(id) {
            savedOutfits = savedOutfits.filter(o => o.id !== id);
            saveSavedOutfits();
        }

        function loadSavedOutfit(id) {
            const outfit = savedOutfits.find(o => o.id === id);
            if (outfit) {
                currentOutfit = { top: outfit.top, bottom: outfit.bottom, shoes: outfit.shoes };
                displayOutfit(currentOutfit);
                window.scrollTo({ top: 0, behavior: 'smooth' });
            }
        }

        function renderSavedOutfits() {
            const grid = document.getElementById('saved-outfits-grid');
            if (savedOutfits.length === 0) {
                grid.innerHTML = `<div class="col-span-full text-center py-6 text-slate-500 text-xs font-medium">אין לוקים שמורים עדיין. לחץ על "שמור לוק" כשתמצא שילוב שאהבת!</div>`;
                return;
            }

            grid.innerHTML = savedOutfits.map(outfit => `
                <div class="bg-slate-800/60 rounded-2xl p-3 border border-slate-700/60 flex flex-col justify-between relative group">
                    <button onclick="removeSavedOutfit(${outfit.id})" class="absolute top-2 left-2 bg-rose-600 hover:bg-rose-700 text-white rounded-full w-5 h-5 flex items-center justify-center text-[10px] shadow-sm z-10">
                        ✕
                    </button>
                    <div class="flex gap-2 mb-2 items-center justify-center bg-slate-900/60 p-2 rounded-xl border border-slate-800">
                        ${outfit.top ? `<img src="${outfit.top.image}" class="w-12 h-12 object-cover rounded-lg">` : ''}
                        ${outfit.bottom ? `<img src="${outfit.bottom.image}" class="w-12 h-12 object-cover rounded-lg">` : ''}
                        ${outfit.shoes ? `<img src="${outfit.shoes.image}" class="w-12 h-12 object-cover rounded-lg">` : ''}
                    </div>
                    <div class="flex justify-between items-center text-[11px] text-slate-400 font-bold px-1">
                        <span>לוק מ-${outfit.date}</span>
                        <button onclick="loadSavedOutfit(${outfit.id})" class="text-cyan-400 hover:text-cyan-300 font-extrabold flex items-center gap-1">
                            הצג על הראווה <i class="fa-solid fa-arrow-up"></i>
                        </button>
                    </div>
                </div>
            `).join('');
        }

        function shareCurrentOutfit() {
            const details = [];
            if (currentOutfit.top) details.push(`חולצה: ${currentOutfit.top.name}`);
            if (currentOutfit.bottom) details.push(`מכנסיים: ${currentOutfit.bottom.name}`);
            if (currentOutfit.shoes) details.push(`נעליים: ${currentOutfit.shoes.name}`);

            if (details.length === 0) return;

            const text = `✨ בדוק את הלוק שהרכבתי ב-SmartStyle:\n` + details.join('\n');

            if (navigator.share) {
                navigator.share({
                    title: 'SmartStyle Outfit',
                    text: text,
                    url: window.location.href
                }).catch(() => {});
            } else {
                navigator.clipboard.writeText(text);
                alert("פרטי הלוק הועתקו ללוח! תוכל להדביק ולשתף בווטסאפ.");
            }
        }

        renderCloset();
        renderSavedOutfits();
    </script>
</body>
</html>

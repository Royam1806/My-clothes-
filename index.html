    <script>
        let closet = JSON.parse(localStorage.getItem('smartstyle_closet')) || [];
        let savedOutfits = JSON.parse(localStorage.getItem('smartstyle_saved_outfits')) || [];
        let currentOutfit = { jacket: null, top: null, bottom: null, shoes: null };

        const colorMap = {
            black: "שחור", white: "לבן", grey: "אפור",
            blue: "כחול", beige: "בז'", green: "ירוק", red: "אדום"
        };

        const matchingRules = {
            black: ['black', 'white', 'grey', 'blue', 'beige', 'green', 'red'],
            white: ['black', 'white', 'grey', 'blue', 'beige', 'green', 'red'],
            grey: ['black', 'white', 'grey', 'blue', 'beige'],
            blue: ['black', 'white', 'grey', 'blue', 'beige'],
            beige: ['black', 'white', 'blue', 'beige', 'green'],
            green: ['black', 'white', 'beige'],
            red: ['black', 'white', 'blue']
        };

        function saveCloset() {
            try {
                localStorage.setItem('smartstyle_closet', JSON.stringify(closet));
            } catch (e) {
                alert("אזהרה: זיכרון הדפדפן מלא! כדאי למחוק פריטים ישנים.");
            }
            renderCloset();
        }

        function saveSavedOutfits() {
            localStorage.setItem('smartstyle_saved_outfits', JSON.stringify(savedOutfits));
            renderSavedOutfits();
        }

        function compressImage(file, callback) {
            const reader = new FileReader();
            reader.onload = function(event) {
                const img = new Image();
                img.src = event.target.result;
                img.onload = function() {
                    const canvas = document.createElement('canvas');
                    const maxDim = 400;
                    let width = img.width;
                    let height = img.height;

                    if (width > height) {
                        if (width > maxDim) {
                            height *= maxDim / width;
                            width = maxDim;
                        }
                    } else {
                        if (height > maxDim) {
                            width *= maxDim / height;
                            height = maxDim;
                        }
                    }

                    canvas.width = width;
                    canvas.height = height;
                    const context = canvas.getContext('2d');
                    context.drawImage(img, 0, 0, width, height);

                    const compressedBase64 = canvas.toDataURL('image/jpeg', 0.7);
                    callback(compressedBase64);
                }
            };
            reader.readAsDataURL(file);
        }

        function extractColorFromImage(imgSrc, callback) {
            const img = new Image();
            img.crossOrigin = "Anonymous";
            img.src = imgSrc;
            img.onload = function () {
                const canvas = document.createElement("canvas");
                const ctx = canvas.getContext("2d");
                canvas.width = 50;
                canvas.height = 50;
                ctx.drawImage(img, 0, 0, 50, 50);
                const data = ctx.getImageData(0, 0, 50, 50).data;
                
                let r = 0, g = 0, b = 0, count = 0;
                for (let i = 0; i < data.length; i += 16) {
                    r += data[i];
                    g += data[i + 1];
                    b += data[i + 2];
                    count++;
                }
                r = Math.floor(r / count);
                g = Math.floor(g / count);
                b = Math.floor(b / count);

                callback(detectCategory(r, g, b));
            };
        }

        function detectCategory(r, g, b) {
            const brightness = (r + g + b) / 3;
            if (brightness < 60) return "black";
            if (brightness > 200) return "white";
            if (Math.abs(r - g) < 20 && Math.abs(g - b) < 20) return "grey";
            if (b > r && b > g) return "blue";
            if (g > r && g > b) return "green";
            if (r > g && r > b) return (g > 100) ? "beige" : "red";
            return "black";
        }

        function handleAddItem(e) {
            e.preventDefault();
            const btn = document.getElementById('submit-btn');
            btn.innerHTML = `<i class="fa-solid fa-spinner fa-spin"></i> שומר...`;

            const name = document.getElementById('item-name').value;
            const type = document.getElementById('item-type').value;
            const weather = document.getElementById('item-weather').value;
            const event = document.getElementById('item-event').value;
            const selectedColor = document.getElementById('item-color').value;
            const fileInput = document.getElementById('item-image');

            if (fileInput.files && fileInput.files[0]) {
                compressImage(fileInput.files[0], (compressedImage) => {
                    if (selectedColor === 'auto') {
                        extractColorFromImage(compressedImage, (detectedColor) => {
                            saveNewItem(name, type, weather, event, detectedColor, compressedImage);
                            btn.innerHTML = `<i class="fa-solid fa-cloud-arrow-up text-cyan-400"></i> שמור בארון`;
                        });
                    } else {
                        saveNewItem(name, type, weather, event, selectedColor, compressedImage);
                        btn.innerHTML = `<i class="fa-solid fa-cloud-arrow-up text-cyan-400"></i> שמור בארון`;
                    }
                });
            }
        }

        function saveNewItem(name, type, weather, event, color, image) {
            const newItem = {
                id: Date.now(),
                name, type, weather, event, color, image, inLaundry: false
            };
            closet.push(newItem);
            saveCloset();
            document.getElementById('add-item-form').reset();
        }

        function toggleLaundry(id) {
            const item = closet.find(i => i.id === id);
            if (item) {
                item.inLaundry = !item.inLaundry;
                saveCloset();
            }
        }

        function removeItem(id) {
            closet = closet.filter(item => item.id !== id);
            saveCloset();
        }

        function clearCloset() {
            if (confirm("האם אתה בטוח שברצונך למחוק את כל הפריטים בארון?")) {
                closet = [];
                saveCloset();
            }
        }

        function renderCloset() {
            const grid = document.getElementById('closet-grid');
            document.getElementById('item-count').textContent = closet.length;

            if (closet.length === 0) {
                grid.innerHTML = `<div class="col-span-full text-center py-8 text-slate-500 text-xs font-medium">הארון ריק כרגע.<br>הוסף בגדים כדי להתחיל!</div>`;
                return;
            }

            grid.innerHTML = closet.map(item => `
                <div class="relative group bg-slate-800/60 rounded-2xl overflow-hidden border border-slate-700/60 flex flex-col items-center p-2 ${item.inLaundry ? 'opacity-40 grayscale' : ''}">
                    <img src="${item.image}" class="w-full h-20 object-cover rounded-xl mb-1">
                    <span class="text-[10px] text-slate-300 truncate w-full text-center font-bold">${item.name}</span>
                    <span class="text-[9px] text-cyan-400 font-semibold">${colorMap[item.color] || item.color}</span>
                    
                    <!-- Laundry Toggle Button -->
                    <button onclick="toggleLaundry(${item.id})" title="${item.inLaundry ? 'החזר מאזור הכביסה' : 'העבר לכביסה'}" class="absolute top-1.5 right-1.5 bg-slate-900/90 text-amber-400 hover:text-amber-300 rounded-full w-6 h-6 flex items-center justify-center text-[10px] shadow-sm z-10">
                        <i class="fa-solid fa-shirt"></i>
                    </button>

                    <!-- Delete Button -->
                    <button onclick="removeItem(${item.id})" class="absolute top-1.5 left-1.5 bg-rose-600/90 hover:bg-rose-600 text-white rounded-full w-5 h-5 flex items-center justify-center text-[10px] opacity-0 group-hover:opacity-100 transition shadow-sm z-10">
                        ✕
                    </button>
                </div>
            `).join('');
        }

        // Feature 1: Live Weather Fetching via Open-Meteo API
        function fetchLiveWeather() {
            const btnText = document.getElementById('weather-btn-text');
            btnText.textContent = "מזהה מיקום...";

            if ("geolocation" in navigator) {
                navigator.geolocation.getCurrentPosition(async (position) => {
                    const lat = position.coords.latitude;
                    const lon = position.coords.longitude;

                    try {
                        const res = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current_weather=true`);
                        const data = await res.json();
                        const temp = Math.round(data.current_weather.temperature);

                        document.getElementById('weather-info-box').classList.remove('hidden');
                        document.getElementById('weather-location').textContent = `📍 מזהה מזג אוויר מקומי`;
                        document.getElementById('weather-temp').textContent = `${temp}°C`;

                        const weatherSelect = document.getElementById('weather-select');
                        if (temp > 24) {
                            weatherSelect.value = "summer";
                        } else if (temp < 17) {
                            weatherSelect.value = "winter";
                        } else {
                            weatherSelect.value = "transition";
                        }

                        btnText.textContent = "עודכן בלייב!";
                    } catch (e) {
                        alert("שגיאה במשיכת נתוני מזג האוויר.");
                        btnText.textContent = "מזג אוויר בלייב";
                    }
                }, () => {
                    alert("אנא אפשר גישה למיקום בדפדפן כדי למשוך מזג אוויר.");
                    btnText.textContent = "מזג אוויר בלייב";
                });
            } else {
                alert("הדפדפן שלך אינו תומך בזיהוי מיקום.");
            }
        }

        function generateOutfit() {
            const selectedEvent = document.getElementById('event-select').value;
            const selectedWeather = document.getElementById('weather-select').value;

            // Filter out items in laundry
            const activeCloset = closet.filter(i => !i.inLaundry);

            const filterByType = (type) => {
                let items = activeCloset.filter(i => i.type === type);
                if (selectedEvent !== 'all') {
                    items = items.filter(i => i.event === selectedEvent || i.event === 'casual');
                }
                if (selectedWeather !== 'all') {
                    items = items.filter(i => i.weather === selectedWeather || i.weather === 'all');
                }
                if (items.length === 0) items = activeCloset.filter(i => i.type === type);
                return items;
            };

            const jackets = filterByType('jacket');
            const tops = filterByType('top');
            const bottoms = filterByType('bottom');
            const shoesList = filterByType('shoes');

            if (tops.length === 0 && bottoms.length === 0 && shoesList.length === 0 && jackets.length === 0) {
                alert("אנא הוסף פריטים זמינים (שאינם בכביסה) לארון ראשית!");
                return;
            }

            const chosenTop = tops[Math.floor(Math.random() * tops.length)] || null;

            // Optional Jacket logic for winter / transition weather
            let chosenJacket = null;
            if ((selectedWeather === 'winter' || selectedWeather === 'transition' || selectedWeather === 'all') && jackets.length > 0) {
                if (Math.random() > 0.3) {
                    chosenJacket = jackets[Math.floor(Math.random() * jackets.length)];
                }
            }

            let compatibleBottoms = bottoms;
            if (chosenTop && chosenTop.color && matchingRules[chosenTop.color]) {
                const allowedColors = matchingRules[chosenTop.color];
                compatibleBottoms = bottoms.filter(b => allowedColors.includes(b.color));
                if (compatibleBottoms.length === 0) compatibleBottoms = bottoms;
            }
            const chosenBottom = compatibleBottoms[Math.floor(Math.random() * compatibleBottoms.length)] || null;

            let compatibleShoes = shoesList;
            if (chosenBottom && chosenBottom.color && matchingRules[chosenBottom.color]) {
                const allowedColors = matchingRules[chosenBottom.color];
                compatibleShoes = shoesList.filter(s => allowedColors.includes(s.color));
                if (compatibleShoes.length === 0) compatibleShoes = shoesList;
            }
            const chosenShoes = compatibleShoes[Math.floor(Math.random() * compatibleShoes.length)] || null;

            currentOutfit = { jacket: chosenJacket, top: chosenTop, bottom: chosenBottom, shoes: chosenShoes };
            displayOutfit(currentOutfit);
        }

        function displayOutfit(outfit) {
            updateSlot('slot-jacket', outfit.jacket, 'ג'קט / מעיל', 'jacket-cutout');
            updateSlot('slot-top', outfit.top, 'חולצה', 'top-cutout');
            updateSlot('slot-bottom', outfit.bottom, 'מכנסיים', 'bottom-cutout');
            updateSlot('slot-shoes', outfit.shoes, 'נעליים', 'shoes-cutout');

            const actionsDiv = document.getElementById('outfit-actions');
            if (outfit.top || outfit.bottom || outfit.shoes || outfit.jacket) {
                actionsDiv.classList.remove('hidden');
            } else {
                actionsDiv.classList.add('hidden');
            }
        }

        function updateSlot(slotId, item, placeholder, cutoutClass) {
            const slot = document.getElementById(slotId);
            if (item) {
                slot.innerHTML = `
                    <div class="w-full h-full ${cutoutClass} overflow-hidden relative">
                        <img src="${item.image}" class="w-full h-full object-cover">
                    </div>
                    <div class="absolute bottom-0 inset-x-0 bg-slate-900/90 backdrop-blur-md text-slate-200 text-[10px] text-center py-0.5 truncate px-2 flex justify-between items-center font-bold border-t border-slate-800 z-10">
                        <span>${item.name}</span>
                        <span class="text-cyan-400 font-extrabold">${colorMap[item.color] || ''}</span>
                    </div>
                `;
            } else {
                slot.innerHTML = `<span class="text-xs text-slate-500">אין ${placeholder}</span>`;
            }
        }

        function saveCurrentOutfit() {
            if (!currentOutfit.top && !currentOutfit.bottom && !currentOutfit.shoes && !currentOutfit.jacket) return;
            
            const newSavedOutfit = {
                id: Date.now(),
                jacket: currentOutfit.jacket,
                top: currentOutfit.top,
                bottom: currentOutfit.bottom,
                shoes: currentOutfit.shoes,
                date: new Date().toLocaleDateString('he-IL')
            };

            savedOutfits.unshift(newSavedOutfit);
            saveSavedOutfits();
            alert("הלוק נשמר בהצלחה בלוקים השמורים! 💖");
        }

        function removeSavedOutfit(id) {
            savedOutfits = savedOutfits.filter(o => o.id !== id);
            saveSavedOutfits();
        }

        function loadSavedOutfit(id) {
            const outfit = savedOutfits.find(o => o.id === id);
            if (outfit) {
                currentOutfit = { jacket: outfit.jacket, top: outfit.top, bottom: outfit.bottom, shoes: outfit.shoes };
                displayOutfit(currentOutfit);
                window.scrollTo({ top: 0, behavior: 'smooth' });
            }
        }

        function renderSavedOutfits() {
            const grid = document.getElementById('saved-outfits-grid');
            if (savedOutfits.length === 0) {
                grid.innerHTML = `<div class="col-span-full text-center py-6 text-slate-500 text-xs font-medium">אין לוקים שמורים עדיין. לחץ על "שמור לוק" כשתמצא שילוב שאהבת!</div>`;
                return;
            }

            grid.innerHTML = savedOutfits.map(outfit => `
                <div class="bg-slate-800/60 rounded-2xl p-3 border border-slate-700/60 flex flex-col justify-between relative group">
                    <button onclick="removeSavedOutfit(${outfit.id})" class="absolute top-2 left-2 bg-rose-600 hover:bg-rose-700 text-white rounded-full w-5 h-5 flex items-center justify-center text-[10px] shadow-sm z-10">
                        ✕
                    </button>
                    <div class="flex gap-2 mb-2 items-center justify-center bg-slate-900/60 p-2 rounded-xl border border-slate-800">
                        ${outfit.jacket ? `<img src="${outfit.jacket.image}" class="w-10 h-10 object-cover rounded-lg">` : ''}
                        ${outfit.top ? `<img src="${outfit.top.image}" class="w-10 h-10 object-cover rounded-lg">` : ''}
                        ${outfit.bottom ? `<img src="${outfit.bottom.image}" class="w-10 h-10 object-cover rounded-lg">` : ''}
                        ${outfit.shoes ? `<img src="${outfit.shoes.image}" class="w-10 h-10 object-cover rounded-lg">` : ''}
                    </div>
                    <div class="flex justify-between items-center text-[11px] text-slate-400 font-bold px-1">
                        <span>לוק מ-${outfit.date}</span>
                        <button onclick="loadSavedOutfit(${outfit.id})" class="text-cyan-400 hover:text-cyan-300 font-extrabold flex items-center gap-1">
                            הצג על הראווה <i class="fa-solid fa-arrow-up"></i>
                        </button>
                    </div>
                </div>
            `).join('');
        }

        function shareCurrentOutfit() {
            const details = [];
            if (currentOutfit.jacket) details.push(`ג'קט: ${currentOutfit.jacket.name}`);
            if (currentOutfit.top) details.push(`חולצה: ${currentOutfit.top.name}`);
            if (currentOutfit.bottom) details.push(`מכנסיים: ${currentOutfit.bottom.name}`);
            if (currentOutfit.shoes) details.push(`נעליים: ${currentOutfit.shoes.name}`);

            if (details.length === 0) return;

            const text = `✨ בדוק את הלוק שהרכבתי ב-SmartStyle:\n` + details.join('\n');

            if (navigator.share) {
                navigator.share({
                    title: 'SmartStyle Outfit',
                    text: text,
                    url: window.location.href
                }).catch(() => {});
            } else {
                navigator.clipboard.writeText(text);
                alert("פרטי הלוק הועתקו ללוח! תוכל להדביק ולשתף בווטסאפ.");
            }
        }

        renderCloset();
        renderSavedOutfits();
    </script>
</body>
</html>
